apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: dojo
data:
  DB_HOST: mysql-service
  DB_PORT: "3306"
  DB_NAME: dojo
  API_PREFIX: /api/v1
  APP_NAME: Dojo Manager API
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: dojo
type: Opaque
stringData:
  DB_USER: dojo
  DB_PASSWORD: dojo
  SECRET_KEY: change-me-in-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dojo
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Replace with your OCIR image path
          image: <ocir-namespace>/dojo-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: dojo
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
