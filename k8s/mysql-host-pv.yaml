# Manual PersistentVolume for MySQL (MVP - single node OKE)
# For production, replace with OCI Block Volume dynamic provisioning.
#
# Usage: kubectl apply -f k8s/mysql-host-pv.yaml
# Note: The hostPath directory must exist on the node.
# Create it via: sudo mkdir -p /mnt/data/mysql && sudo chmod 777 /mnt/data/mysql
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  labels:
    type: local
    app: mysql
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/mysql
    type: DirectoryOrCreate
