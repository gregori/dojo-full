apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  namespace: dojo
  labels:
    app: backend
    job: migration
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: backend
        job: migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: <ocir-namespace>/dojo-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          env:
            - name: DATABASE_URL
              value: "mysql+aiomysql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"