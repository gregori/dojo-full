apiVersion: v1
kind: Secret
metadata:
  name: oci-credentials
  namespace: dojo
type: Opaque
stringData:
  OCI_TENANCY: "${OCI_TENANCY}"
  OCI_USER: "${OCI_USER}"
  OCI_FINGERPRINT: "${OCI_FINGERPRINT}"
  OCI_PRIVATE_KEY: "${OCI_PRIVATE_KEY}"
  OCI_REGION: "${OCI_REGION}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: dojo
  labels:
    app: mysql-backup
spec:
  # Daily at 2:00 AM UTC
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800  # 30 min timeout
      template:
        spec:
          containers:
            - name: mysql-backup
              image: mysql:8.4
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  BACKUP_FILE="dojo-backup-$(date +%Y%m%d-%H%M%S).sql.gz"
                  BACKUP_DIR="/tmp/backups"
                  mkdir -p "$BACKUP_DIR"

                  echo "Starting MySQL backup..."
                  mysqldump \
                    -h mysql-service \
                    -u "$MYSQL_USER" \
                    -p"$MYSQL_PASSWORD" \
                    --single-transaction \
                    --routines \
                    --triggers \
                    "$MYSQL_DATABASE" | gzip > "$BACKUP_DIR/$BACKUP_FILE"

                  BACKUP_SIZE=$(stat -c%s "$BACKUP_DIR/$BACKUP_FILE" 2>/dev/null || stat -f%z "$BACKUP_DIR/$BACKUP_FILE")
                  echo "Backup created: $BACKUP_FILE ($BACKUP_SIZE bytes)"

                  if [ "$BACKUP_SIZE" -lt 100 ]; then
                    echo "ERROR: Backup file too small, likely failed"
                    exit 1
                  fi

                  echo "Backup completed successfully"

                  # Upload to OCI Object Storage (requires OCI CLI)
                  # Uncomment when OCI CLI image is available:
                  # oci os object put \
                  #   -bn "$OCI_OSS_BUCKET" \
                  #   --name "$BACKUP_FILE" \
                  #   --file "$BACKUP_DIR/$BACKUP_FILE"
              env:
                - name: MYSQL_USER
                  valueFrom:
                    secretKeyRef:
                      name: mysql-secret
                      key: MYSQL_USER
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-secret
                      key: MYSQL_PASSWORD
                - name: MYSQL_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: mysql-secret
                      key: MYSQL_DATABASE
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          restartPolicy: OnFailure
