apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: dojo
type: Opaque
# Values must be provided via kubectl or CI/CD secrets management.
# Example: kubectl create secret generic mysql-secret -n dojo \
#   --from-literal=MYSQL_ROOT_PASSWORD=<strong-password> \
#   --from-literal=MYSQL_USER=dojo \
#   --from-literal=MYSQL_PASSWORD=<strong-password> \
#   --from-literal=MYSQL_DATABASE=dojo
stringData:
  MYSQL_ROOT_PASSWORD: ""  # SET VIA SECRETS
  MYSQL_USER: dojo
  MYSQL_PASSWORD: ""  # SET VIA SECRETS
  MYSQL_DATABASE: dojo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: dojo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # MVP: hostPath via manual PV (see mysql-host-pv.yaml)
  # Production: replace with OCI Block Volume dynamic provisioning
  storageClassName: manual  # Binds to mysql-pv (hostPath)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: dojo
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate  # Required for single-replica with PVC
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: mysql-secret
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: dojo
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
  type: ClusterIP
