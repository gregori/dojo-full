services:
  mysql:
    image: mysql:8.4
    container_name: dojo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dojo
      MYSQL_USER: dojo
      MYSQL_PASSWORD: dojo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dojo-network

  backend:
    build:
      context: ./dojo-app/backend
      dockerfile: Dockerfile.dev
    container_name: dojo-backend
    environment:
      DATABASE_URL: mysql+pymysql://dojo:dojo@mysql:3306/dojo
      SECRET_KEY: dev-secret-change-me-in-production
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./dojo-app/backend:/app
      - /app/.venv
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dojo-network

  frontend:
    build:
      context: ./dojo-app/frontend
      dockerfile: Dockerfile.dev
    container_name: dojo-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - dojo-network

volumes:
  mysql_data:

networks:
  dojo-network:
    driver: bridge
