name: CD - Deploy Frontend

on:
  push:
    branches: [master]
    paths:
      - 'dojo-app/frontend/**'
      - '.github/workflows/cd-frontend.yml'
  workflow_dispatch:

env:
  OCI_REGION: sa-saopaulo-1
  OCI_REGISTRY: ${{ secrets.OCI_REGISTRY }}
  IMAGE_NAME: dojo-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dojo-app/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCI_REGISTRY }}
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./dojo-app/frontend
          file: ./dojo-app/frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          mkdir -p $HOME/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > $HOME/.oci/oci_api_key.pem
          chmod 600 $HOME/.oci/oci_api_key.pem

          curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          bash install.sh --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Kubectl
        run: |
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ secrets.OCI_CLUSTER_ID }} \
            --file $HOME/.kube/config \
            --region ${{ env.OCI_REGION }} \
            --token-version 2.0.0
        env:
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: $HOME/.oci/oci_api_key.pem
          OCI_CLI_REGION: ${{ env.OCI_REGION }}

      - name: Update deployment image
        run: |
          kubectl set image deployment/dojo-frontend \
            frontend=${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/dojo-frontend:${{ github.sha }} \
            -n dojo

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/dojo-frontend -n dojo --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n dojo -l app=dojo-frontend
          kubectl get svc -n dojo dojo-frontend
