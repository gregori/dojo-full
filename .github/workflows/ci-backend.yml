name: CI - Backend

on:
  push:
    branches: [master]
    paths:
      - 'dojo-app/backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [master]
    paths:
      - 'dojo-app/backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dojo-app/backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: dojo_test_db
          MYSQL_USER: dojo_test_user
          MYSQL_PASSWORD: dojo_test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ./dojo-app/backend/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('dojo-app/backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run lint (Ruff)
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Run unit and integration tests
        env:
          DATABASE_URL: mysql+pymysql://dojo_test_user:dojo_test_pass@localhost:3306/dojo_test_db
          SECRET_KEY: test-secret-key
        run: |
          poetry run pytest tests/unit -v --cov=app --cov-report=xml --cov-report=term

      - name: Run BDD smoke tests
        env:
          DATABASE_URL: mysql+pymysql://dojo_test_user:dojo_test_pass@localhost:3306/dojo_test_db
          SECRET_KEY: test-secret-key
        run: |
          poetry run behave tests/bdd/features --tags=@smoke --format=pretty

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./dojo-app/backend/coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    defaults:
      run:
        working-directory: dojo-app/backend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t dojo-backend:${{ github.sha }} -f Dockerfile.prod .

      - name: Push to OCI Registry (production)
        if: github.event_name == 'push'
        run: |
          echo "Push to OCIR would happen here"
          # docker login -u <user> -p <token> <region>.ocir.io
          # docker tag dojo-backend:${{ github.sha }} <region>.ocir.io/<tenancy>/dojo-backend:${{ github.sha }}
          # docker push <region>.ocir.io/<tenancy>/dojo-backend:${{ github.sha }}
