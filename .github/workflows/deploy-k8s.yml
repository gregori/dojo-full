name: Deploy to Kubernetes

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'dojo-infra/k8s/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Install OCI CLI
        run: |
          curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          bash install.sh --accept-all-defaults
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Kubeconfig
        run: |
          oci ce cluster create-kubeconfig \
            --cluster-id ${{ secrets.OCI_CLUSTER_ID }} \
            --file $HOME/.kube/config \
            --region ${{ secrets.OCI_REGION }} \
            --token-version 2.0.0
        env:
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: ~/.oci/oci_api_key.pem
          OCI_CLI_REGION: ${{ secrets.OCI_REGION }}

      - name: Create K8s Secrets
        run: |
          kubectl create namespace dojo --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic dojo-secrets -n dojo \
            --from-literal=mysql-root-password="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --from-literal=mysql-password="${{ secrets.MYSQL_PASSWORD }}" \
            --from-literal=secret-key="${{ secrets.SECRET_KEY }}" \
            --from-literal=database-url="mysql+pymysql://dojo_user:${{ secrets.MYSQL_PASSWORD }}@mysql:3306/dojo_db" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -k dojo-infra/k8s/

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/dojo-backend -n dojo --timeout=300s
          kubectl rollout status deployment/dojo-frontend -n dojo --timeout=300s
