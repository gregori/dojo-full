name: CD - Cluster Bootstrap (one-time HTTPS setup)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Bootstrap action to run'
        required: true
        type: choice
        options:
          - status
          - fix-traefik-ports
          - install-cert-manager
          - create-cluster-issuer
          - test-nwplcy-default-accept
          - trace-packet
          - test-protocols-and-routes

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Status check
        if: github.event.inputs.action == 'status'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            echo "--- NetworkPolicy resources (any namespace) ---"
            sudo k3s kubectl get networkpolicy -A 2>&1
            echo "--- kube-router pods ---"
            sudo k3s kubectl get pods -n kube-system -o wide | grep -i router || echo "no kube-router pods found by name"
            sudo k3s kubectl get pods -n kube-system -l k8s-app=kube-router -o wide 2>&1 || true
            echo "--- kube-router logs mentioning 'network policy' or 'default' (last 40 matching lines) ---"
            KUBE_ROUTER_POD=$(sudo k3s kubectl get pods -n kube-system -l k8s-app=kube-router -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
            echo "kube-router pod: $KUBE_ROUTER_POD"
            if [ -n "$KUBE_ROUTER_POD" ]; then
              sudo k3s kubectl logs -n kube-system "$KUBE_ROUTER_POD" --tail=200 2>&1 | grep -iE "network ?polic|default|deny|firewall" | tail -40
            fi
            echo "--- long-lived debug pod: create, wait 10s for kube-router sync, then check its specific FW chain + test egress ---"
            sudo k3s kubectl delete pod netdebug3 -n cert-manager --ignore-not-found --now 2>&1 || true
            sudo k3s kubectl run netdebug3 -n cert-manager --image=curlimages/curl:8.10.1 --restart=Never --command -- sleep 120
            sudo k3s kubectl wait --for=condition=Ready --timeout=30s pod/netdebug3 -n cert-manager || true
            POD_IP=$(sudo k3s kubectl get pod netdebug3 -n cert-manager -o jsonpath='{.status.podIP}')
            echo "netdebug3 IP: $POD_IP"
            sleep 10
            echo "-- matching iptables rules for this pod IP --"
            sudo iptables-save 2>&1 | grep "$POD_IP" | head -20
            echo "-- egress test after the 10s sync wait --"
            sudo k3s kubectl exec -n cert-manager netdebug3 -- curl -sS -v --max-time 4 https://github.com 2>&1 | tail -15 || true
            sudo k3s kubectl delete pod netdebug3 -n cert-manager --ignore-not-found --now 2>&1 || true
            echo "--- Node health/uptime (sanity check after a failed boot-volume-replacement precheck) ---"
            uptime
            sudo k3s kubectl get nodes -o wide
            sudo k3s kubectl get pods -A -o wide | grep -v Running
            echo "--- Node-level connectivity to Let's Encrypt ---"
            curl -v --max-time 8 https://acme-v02.api.letsencrypt.org/directory 2>&1 | tail -20
            echo "--- Pod-level connectivity to Let's Encrypt (dedicated debug pod, same cluster network) ---"
            sudo k3s kubectl delete pod netdebug -n cert-manager --ignore-not-found --now 2>&1 || true
            sudo k3s kubectl run netdebug -n cert-manager --image=curlimages/curl:8.10.1 --restart=Never --command -- sleep 60
            sudo k3s kubectl wait --for=condition=Ready --timeout=30s pod/netdebug -n cert-manager || true
            echo "-- DNS resolution --"
            sudo k3s kubectl exec -n cert-manager netdebug -- nslookup acme-v02.api.letsencrypt.org 2>&1 || true
            echo "-- curl -v to ACME directory --"
            sudo k3s kubectl exec -n cert-manager netdebug -- curl -v --max-time 8 https://acme-v02.api.letsencrypt.org/directory 2>&1 | tail -25 || true
            echo "-- curl -v to a known-good external host (github.com) for comparison --"
            sudo k3s kubectl exec -n cert-manager netdebug -- curl -v --max-time 8 https://github.com 2>&1 | tail -10 || true
            sudo k3s kubectl delete pod netdebug -n cert-manager --ignore-not-found --now 2>&1 || true
            echo "--- iptables nat POSTROUTING (MASQUERADE rules) ---"
            sudo iptables -t nat -L POSTROUTING -n -v 2>&1
            echo "--- ip_forward sysctl ---"
            sudo sysctl net.ipv4.ip_forward 2>&1
            echo "--- VNIC skip_source_dest_check (actual OCI API state, not terraform) ---"
            curl -sS --max-time 8 -L http://169.254.169.254/opc/v2/vnics/ -H "Authorization: Bearer Oracle" 2>&1
            echo "--- outbound curl from node with explicit source IP = pod gateway (10.42.0.1) sanity check ---"
            curl -sSv --max-time 8 --interface 10.0.1.8 https://github.com 2>&1 | tail -10 || true
            echo "--- FULL iptables-save (all tables: filter, nat, mangle, raw) ---"
            sudo iptables-save -c 2>&1
            echo "--- rp_filter sysctl ---"
            sudo sysctl -a 2>/dev/null | grep rp_filter
            echo "--- routing table ---"
            ip route show 2>&1
            echo "--- primary physical interface ---"
            PRIMARY_IF=$(ip route get 8.8.8.8 | awk '/dev/ {for(i=1;i<=NF;i++) if ($i=="dev") print $(i+1)}')
            echo "primary interface: $PRIMARY_IF"
            ip -4 addr show "$PRIMARY_IF" 2>&1
            echo "--- tcpdump availability ---"
            which tcpdump 2>&1 || sudo dnf install -y tcpdump 2>&1 | tail -5 || true
            echo "--- realtime tcpdump ON THE PHYSICAL INTERFACE (not 'any', which can show pre-NAT addresses misleadingly) while a debug pod tries to connect ---"
            sudo k3s kubectl delete pod netdebug2 -n cert-manager --ignore-not-found --now 2>&1 || true
            sudo k3s kubectl run netdebug2 -n cert-manager --image=curlimages/curl:8.10.1 --restart=Never --command -- sleep 30
            sudo k3s kubectl wait --for=condition=Ready --timeout=30s pod/netdebug2 -n cert-manager || true
            sudo timeout 8 tcpdump -ni "$PRIMARY_IF" host 172.65.32.248 -c 20 > /tmp/tcpdump_phys.out 2>&1 &
            TCPDUMP_PID=$!
            sleep 1
            sudo k3s kubectl exec -n cert-manager netdebug2 -- curl -sS --max-time 4 https://acme-v02.api.letsencrypt.org/directory 2>&1 || true
            wait $TCPDUMP_PID 2>&1 || true
            cat /tmp/tcpdump_phys.out 2>&1 || true
            echo "--- conntrack table entries for this pod IP ---"
            sudo conntrack -L 2>&1 | grep "10.42.0" | head -10 || echo "conntrack not available or no entries"
            sudo k3s kubectl delete pod netdebug2 -n cert-manager --ignore-not-found --now 2>&1 || true
            echo "--- firewalld status ---"
            sudo systemctl is-active firewalld 2>&1 || true
            echo "--- iptables REJECT/DROP rules (OUTPUT/FORWARD) ---"
            sudo iptables -L OUTPUT -n -v 2>&1 | grep -iE "REJECT|DROP" || echo "none in OUTPUT"
            sudo iptables -L FORWARD -n -v 2>&1 | grep -iE "REJECT|DROP" || echo "none in FORWARD"
            echo "--- Traefik HelmChart ---"
            sudo k3s kubectl get helmchart -n kube-system traefik -o yaml || true
            echo "--- Traefik HelmChartConfig ---"
            sudo k3s kubectl get helmchartconfig -n kube-system traefik -o yaml || true
            echo "--- Traefik pod args ---"
            sudo k3s kubectl get pods -n kube-system -l app.kubernetes.io/name=traefik -o jsonpath='{.items[0].spec.containers[0].args}' || true
            echo ""
            echo "--- Traefik service ---"
            sudo k3s kubectl get svc -n kube-system traefik -o yaml || true
            echo "--- Ingress (dojo) ---"
            sudo k3s kubectl get ingress -n dojo -o wide
            echo "--- Certificate (dojo) ---"
            sudo k3s kubectl get certificate -n dojo -o wide || true
            sudo k3s kubectl describe certificate -n dojo dojo-tls || true
            echo "--- CertificateRequest (dojo) ---"
            sudo k3s kubectl get certificaterequest -n dojo -o wide || true
            echo "--- Order (dojo) ---"
            sudo k3s kubectl get order -n dojo -o wide || true
            sudo k3s kubectl describe order -n dojo || true
            echo "--- Challenge (dojo) ---"
            sudo k3s kubectl get challenge -n dojo -o wide || true
            sudo k3s kubectl describe challenge -n dojo || true
            echo "--- ACME solver ingress/pods (dojo) ---"
            sudo k3s kubectl get ingress,pods -n dojo -l acme.cert-manager.io/http01-solver=true || true
            echo "--- cert-manager controller logs (last 60 lines) ---"
            sudo k3s kubectl logs -n cert-manager -l app.kubernetes.io/component=controller --tail=60 || true
            echo "--- cert-manager namespace ---"
            sudo k3s kubectl get ns cert-manager || echo "not installed"
            echo "--- cert-manager pods ---"
            sudo k3s kubectl get pods -n cert-manager -o wide || true
            echo "--- cert-manager webhook logs (last 40 lines) ---"
            sudo k3s kubectl logs -n cert-manager -l app.kubernetes.io/component=webhook --tail=40 || true
            echo "--- cainjector logs (last 40 lines) ---"
            sudo k3s kubectl logs -n cert-manager -l app.kubernetes.io/component=cainjector --tail=40 || true
            echo "--- ValidatingWebhookConfiguration caBundle present? ---"
            sudo k3s kubectl get validatingwebhookconfiguration cert-manager-webhook -o jsonpath='{.webhooks[0].clientConfig.caBundle}' | head -c 50
            echo ""
            echo "--- node time ---"
            date -u

      - name: Test - insert temporary ACCEPT at top of KUBE-NWPLCY-DEFAULT
        if: github.event.inputs.action == 'test-nwplcy-default-accept'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            # Purely diagnostic and ephemeral: kube-router will overwrite this
            # chain on its next reconciliation loop regardless. Confirms
            # whether KUBE-NWPLCY-DEFAULT (reached by every pod's egress path
            # even with zero NetworkPolicy objects in the cluster) is really
            # the block, before looking for the proper permanent fix.
            sudo iptables -I KUBE-NWPLCY-DEFAULT 1 -j ACCEPT
            echo "--- rule inserted, testing egress now ---"
            sudo k3s kubectl delete pod netdebug4 -n cert-manager --ignore-not-found --now 2>&1 || true
            sudo k3s kubectl run netdebug4 -n cert-manager --image=curlimages/curl:8.10.1 --restart=Never --command -- sleep 30
            sudo k3s kubectl wait --for=condition=Ready --timeout=30s pod/netdebug4 -n cert-manager || true
            sudo k3s kubectl exec -n cert-manager netdebug4 -- curl -sS -v --max-time 6 https://github.com 2>&1 | tail -15 || true
            sudo k3s kubectl delete pod netdebug4 -n cert-manager --ignore-not-found --now 2>&1 || true
            echo "--- current KUBE-NWPLCY-DEFAULT content ---"
            sudo iptables -L KUBE-NWPLCY-DEFAULT -n -v --line-numbers

      - name: Trace packet through netfilter with iptables -j TRACE
        if: github.event.inputs.action == 'trace-packet'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            sudo modprobe nf_log_ipv4 2>&1 || true
            sudo sysctl -w net.netfilter.nf_log.2=nf_log_ipv4 2>&1 || true
            sudo iptables -t raw -I OUTPUT 1 -d 4.228.31.150 -j TRACE
            sudo iptables -t raw -I PREROUTING 1 -d 4.228.31.150 -j TRACE
            sudo journalctl -k --since "1 second ago" -f > /tmp/trace.log 2>&1 &
            JLOG_PID=$!
            sudo k3s kubectl delete pod netdebug5 -n cert-manager --ignore-not-found --now 2>&1 || true
            sudo k3s kubectl run netdebug5 -n cert-manager --image=curlimages/curl:8.10.1 --restart=Never --command -- sleep 30
            sudo k3s kubectl wait --for=condition=Ready --timeout=30s pod/netdebug5 -n cert-manager || true
            sudo k3s kubectl exec -n cert-manager netdebug5 -- curl -sS --max-time 4 https://github.com 2>&1 || true
            sleep 2
            sudo kill $JLOG_PID 2>&1 || true
            sudo k3s kubectl delete pod netdebug5 -n cert-manager --ignore-not-found --now 2>&1 || true
            sudo iptables -t raw -D OUTPUT -d 4.228.31.150 -j TRACE 2>&1 || true
            sudo iptables -t raw -D PREROUTING -d 4.228.31.150 -j TRACE 2>&1 || true
            echo "--- TRACE log ---"
            cat /tmp/trace.log 2>&1 | grep -i "TRACE:" | head -60
            echo "--- if empty, dmesg fallback ---"
            sudo dmesg -T 2>&1 | grep -i "TRACE:" | tail -60 || true

      - name: Test ICMP/UDP vs TCP, and check the pod's own network namespace
        if: github.event.inputs.action == 'test-protocols-and-routes'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            sudo k3s kubectl delete pod netdebug6 -n cert-manager --ignore-not-found --now 2>&1 || true
            sudo k3s kubectl run netdebug6 -n cert-manager --image=curlimages/curl:8.10.1 --restart=Never --command -- sleep 60
            sudo k3s kubectl wait --for=condition=Ready --timeout=30s pod/netdebug6 -n cert-manager || true
            POD_IP=$(sudo k3s kubectl get pod netdebug6 -n cert-manager -o jsonpath='{.status.podIP}')
            echo "pod IP: $POD_IP"
            echo "--- pod's own routing table ---"
            sudo k3s kubectl exec -n cert-manager netdebug6 -- sh -c "cat /proc/net/route" 2>&1 || true
            echo "--- ping external IP (ICMP) from pod ---"
            sudo k3s kubectl exec -n cert-manager netdebug6 -- sh -c "ping -c 3 -W 3 8.8.8.8" 2>&1 || true
            echo "--- ping cluster-internal IP (node itself, 10.0.1.8) from pod, sanity check ---"
            sudo k3s kubectl exec -n cert-manager netdebug6 -- sh -c "ping -c 3 -W 3 10.0.1.8" 2>&1 || true
            echo "--- TCP to an internal cluster service (kubernetes.default, should work) ---"
            sudo k3s kubectl exec -n cert-manager netdebug6 -- sh -c "curl -sSk --max-time 4 https://kubernetes.default.svc.cluster.local/ -o /dev/null -w 'http_code=%{http_code}\n'" 2>&1 || true
            echo "--- TCP to node's own IP on an open port (22, should get SYN-ACK or at least not instant refuse) ---"
            sudo k3s kubectl exec -n cert-manager netdebug6 -- sh -c "curl -sSv --max-time 4 telnet://10.0.1.8:22" 2>&1 | tail -10 || true
            echo "--- host node's ARP/neighbor table for pod IP ---"
            ip neigh show | grep "$POD_IP" || echo "no neighbor entry"
            echo "--- TCP to 8.8.8.8:443 (same external IP ping already proved reachable, but TCP+443) ---"
            sudo k3s kubectl exec -n cert-manager netdebug6 -- sh -c "curl -sSv --max-time 4 https://8.8.8.8/ -k" 2>&1 | tail -12 || true
            echo "--- TCP to 8.8.8.8:53 (external IP, different port, DNS-over-TCP) ---"
            sudo k3s kubectl exec -n cert-manager netdebug6 -- sh -c "curl -sSv --max-time 4 telnet://8.8.8.8:53" 2>&1 | tail -10 || true
            echo "--- TCP to 1.1.1.1:443 (different external provider entirely, not Cloudflare-fronted like our earlier targets... wait this IS cloudflare, use a third-party) ---"
            sudo k3s kubectl exec -n cert-manager netdebug6 -- sh -c "curl -sSv --max-time 4 https://1.1.1.1/ -k" 2>&1 | tail -12 || true
            sudo k3s kubectl delete pod netdebug6 -n cert-manager --ignore-not-found --now 2>&1 || true

      - name: Look for eBPF/XDP or a security agent below iptables, and compare wire captures for :53 (works) vs :443 (fails)
        if: github.event.inputs.action == 'test-protocols-and-routes'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            echo "--- XDP/eBPF programs attached to interfaces ---"
            ip link show 2>&1 | grep -i xdp || echo "no xdp shown in ip link"
            sudo bpftool prog list 2>&1 || echo "bpftool not available"
            sudo bpftool net list 2>&1 || true
            echo "--- suspicious security/agent services running ---"
            systemctl list-units --type=service --state=running 2>&1 | grep -iE "oci|cloud.?guard|falco|osquery|crowdstrike|security|agent|waf|firewall"
            echo "--- all listening/active nftables (in case this is nftables-native, not iptables-legacy) ---"
            sudo nft list ruleset 2>&1 | grep -iE "443|reject|drop" | head -40 || echo "nft not available or empty"
            echo "--- primary interface (again) ---"
            PRIMARY_IF=$(ip route get 8.8.8.8 | awk '/dev/ {for(i=1;i<=NF;i++) if ($i=="dev") print $(i+1)}')
            echo "--- capture BOTH a working :53 attempt and a failing :443 attempt on physical interface, back to back ---"
            sudo k3s kubectl delete pod netdebug7 -n cert-manager --ignore-not-found --now 2>&1 || true
            sudo k3s kubectl run netdebug7 -n cert-manager --image=curlimages/curl:8.10.1 --restart=Never --command -- sleep 30
            sudo k3s kubectl wait --for=condition=Ready --timeout=30s pod/netdebug7 -n cert-manager || true
            sudo timeout 6 tcpdump -ni "$PRIMARY_IF" host 8.8.8.8 -c 10 > /tmp/cap53.out 2>&1 &
            P1=$!
            sleep 1
            sudo k3s kubectl exec -n cert-manager netdebug7 -- sh -c "curl -sS --max-time 3 telnet://8.8.8.8:53" 2>&1 || true
            wait $P1 2>&1 || true
            echo ":53 capture:"
            cat /tmp/cap53.out
            sudo timeout 6 tcpdump -ni "$PRIMARY_IF" host 8.8.8.8 -c 10 > /tmp/cap443.out 2>&1 &
            P2=$!
            sleep 1
            sudo k3s kubectl exec -n cert-manager netdebug7 -- sh -c "curl -sSk --max-time 3 https://8.8.8.8/" 2>&1 || true
            wait $P2 2>&1 || true
            echo ":443 capture:"
            cat /tmp/cap443.out
            sudo k3s kubectl delete pod netdebug7 -n cert-manager --ignore-not-found --now 2>&1 || true

      - name: Fix Traefik exposed ports
        if: github.event.inputs.action == 'fix-traefik-ports'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            # Removes the existing global web->websecure redirect
            # (additionalArguments: --entrypoints.web.http.redirections...),
            # which pointed at the entrypoint's internal port (:8443, unreachable
            # externally) and would also break every future cert-manager HTTP-01
            # challenge/renewal by redirecting the ACME solver's port-80 requests
            # away before they can be validated. Service/NodePort mapping
            # (80->8000, 443->8443) is already correct and untouched.
            sudo k3s kubectl apply -f - <<'EOF'
            apiVersion: helm.cattle.io/v1
            kind: HelmChartConfig
            metadata:
              name: traefik
              namespace: kube-system
            spec:
              valuesContent: ""
            EOF
            sleep 15
            sudo k3s kubectl get pods -n kube-system -l app.kubernetes.io/name=traefik
            sudo k3s kubectl get pods -n kube-system -l app.kubernetes.io/name=traefik -o jsonpath='{.items[0].spec.containers[0].args}'

      - name: Install cert-manager
        if: github.event.inputs.action == 'install-cert-manager'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            # Pinned, not "latest": this cluster runs k3s v1.29.14, and
            # cert-manager's newer CRD manifests (v1.17+) use the CRD
            # "selectableFields" field, only understood by Kubernetes >=1.31 --
            # the apiserver here rejects those specific CRDs with a strict
            # decoding error ("unknown field") while unrelated CRDs and all
            # Deployments still apply/start fine, silently leaving
            # certificates.cert-manager.io (and siblings) missing. v1.15.3
            # predates that CRD field and is a supported release for 1.29.
            sudo k3s kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.3/cert-manager.yaml
            sudo k3s kubectl wait --for=condition=Available --timeout=180s -n cert-manager deployment/cert-manager deployment/cert-manager-webhook deployment/cert-manager-cainjector
            sleep 10
            echo "--- CRDs ---"
            sudo k3s kubectl get crd | grep cert-manager.io

      - name: Create ClusterIssuer
        if: github.event.inputs.action == 'create-cluster-issuer'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            sudo k3s kubectl apply -f - <<'EOF'
            apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata:
              name: letsencrypt-prod
            spec:
              acme:
                server: https://acme-v02.api.letsencrypt.org/directory
                email: rodrigo.gregori@gmail.com
                privateKeySecretRef:
                  name: letsencrypt-prod-key
                solvers:
                - http01:
                    ingress:
                      ingressClassName: traefik
            EOF
            sudo k3s kubectl get clusterissuer letsencrypt-prod -o wide
