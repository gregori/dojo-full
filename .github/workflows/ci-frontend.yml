name: CI - Frontend

on:
  push:
    branches: [master, develop]
    paths:
      - 'dojo-app/frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'dojo-app/frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dojo-app/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./dojo-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run unit tests
        run: npm test -- --coverage --watchAll=false --passWithNoTests

      - name: Build application
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: dojo-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./dojo-app/frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ./dojo-app/backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: dojo-app/frontend

      - name: Start Docker Compose stack
        run: |
          docker compose up -d --wait

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/docs > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Wait for frontend to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend failed to start"
          exit 1

      - name: Run Cypress e2e tests
        run: npx cypress run --spec "cypress/e2e/precheckin.cy.ts,cypress/e2e/medical-exam.cy.ts,cypress/e2e/financial.cy.ts"
        working-directory: dojo-app/frontend
        env:
          VITE_API_URL: http://localhost:8000

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down

      - name: Upload Cypress videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: dojo-app/frontend/cypress/videos

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    defaults:
      run:
        working-directory: dojo-app/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t dojo-frontend:${{ github.sha }} -f Dockerfile.prod .

      - name: Push to OCI Registry (production)
        if: github.event_name == 'push'
        run: |
          echo "Push to OCIR would happen here"
