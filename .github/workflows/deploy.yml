name: Deploy

on:
  push:
    branches: [main]

env:
  OCI_REGION: ${{ secrets.OCI_REGION }}
  OCIR_NAMESPACE: ${{ secrets.OCIR_NAMESPACE }}
  REGISTRY: ${{ secrets.OCI_REGION }}.ocir.io
  IMAGE_NAME_BACKEND: ${{ secrets.OCIR_NAMESPACE }}/dojo-backend
  IMAGE_NAME_FRONTEND: ${{ secrets.OCIR_NAMESPACE }}/dojo-frontend

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  push-to-ocir:
    name: Push to OCIR
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCI_TENANCY }}/${{ secrets.OCI_USER }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest

  deploy-to-k3s:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs: push-to-ocir
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync manifests and deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            # Clone/pull repo on the VM
            if [ -d /tmp/dojo-repo ]; then
              cd /tmp/dojo-repo && git pull
            else
              git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} /tmp/dojo-repo
            fi

            # Update image tags in manifests
            cd /tmp/dojo-repo
            sed -i "s|<ocir-namespace>/dojo-backend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}|g" k8s/backend-deployment.yaml
            sed -i "s|<ocir-namespace>/dojo-backend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}|g" k8s/backend-migration-job.yaml
            sed -i "s|<ocir-namespace>/dojo-frontend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}|g" k8s/frontend-deployment.yaml

            # Apply manifests
            sudo k3s kubectl apply -f k8s/namespace.yaml
            sudo k3s kubectl apply -f k8s/mysql-deployment.yaml
            sudo k3s kubectl apply -f k8s/mysql-backup-cronjob.yaml
            sudo k3s kubectl apply -f k8s/backend-migration-job.yaml
            sudo k3s kubectl apply -f k8s/backend-deployment.yaml
            sudo k3s kubectl apply -f k8s/frontend-deployment.yaml
            sudo k3s kubectl apply -f k8s/ingress.yaml
            sudo k3s kubectl apply -f k8s/cert-manager-issuer.yaml

      - name: Wait for backend rollout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            sudo k3s kubectl rollout status deployment/backend -n dojo --timeout=300s

      - name: Wait for frontend rollout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            sudo k3s kubectl rollout status deployment/frontend -n dojo --timeout=300s

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            sudo k3s kubectl get pods -n dojo
            sudo k3s kubectl get services -n dojo
            sudo k3s kubectl get ingress -n dojo
