name: Deploy

on:
  push:
    branches: [master]

env:
  OCI_REGION: ${{ secrets.OCI_REGION }}
  OCIR_NAMESPACE: ${{ secrets.OCIR_NAMESPACE }}
  REGISTRY: ${{ secrets.OCI_REGION }}.ocir.io
  IMAGE_NAME_BACKEND: ${{ secrets.OCIR_NAMESPACE }}/dojo-backend
  IMAGE_NAME_FRONTEND: ${{ secrets.OCIR_NAMESPACE }}/dojo-frontend

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  push-to-ocir:
    name: Push to OCIR
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCI_TENANCY }}/${{ secrets.OCI_USER }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest

  deploy-to-k8s:
    name: Deploy to OKE
    runs-on: ubuntu-latest
    needs: push-to-ocir
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image tags in manifests
        run: |
          sed -i "s|<ocir-namespace>/dojo-backend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|<ocir-namespace>/dojo-backend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}|g" k8s/backend-migration-job.yaml
          sed -i "s|<ocir-namespace>/dojo-frontend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}|g" k8s/frontend-deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/mysql-deployment.yaml
          kubectl apply -f k8s/mysql-backup-cronjob.yaml
          kubectl apply -f k8s/backend-migration-job.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/cert-manager-issuer.yaml

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/backend -n dojo --timeout=300s

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend -n dojo --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n dojo
          kubectl get services -n dojo
          kubectl get ingress -n dojo
