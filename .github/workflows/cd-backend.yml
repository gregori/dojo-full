name: CD - Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'dojo-app/backend/**'
      - '.github/workflows/cd-backend.yml'
  workflow_dispatch:

env:
  OCI_REGION: sa-saopaulo-1
  OCI_REGISTRY: ${{ secrets.OCI_REGISTRY }}
  IMAGE_NAME: dojo-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dojo-app/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCI_REGISTRY }}
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./dojo-app/backend
          file: ./dojo-app/backend/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Notify build complete
        run: |
          echo "Image built and pushed: ${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Deploy step skipped - manually run 'deploy-vm.yml' workflow to deploy to VM"
