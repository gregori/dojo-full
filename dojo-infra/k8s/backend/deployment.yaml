apiVersion: apps/v1
kind: Deployment
metadata:
  name: dojo-backend
  namespace: dojo
  labels:
    app: dojo-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dojo-backend
  template:
    metadata:
      labels:
        app: dojo-backend
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: backend
        image: <region>.ocir.io/<tenancy>/dojo-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dojo-secrets
              key: database-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: dojo-secrets
              key: secret-key
        - name: ENVIRONMENT
          value: "production"
        - name: VAPID_PUBLIC_KEY
          value: "change-me-vapid-public-key"
        - name: VAPID_SUBJECT
          value: "mailto:admin@example.com"
        - name: VAPID_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: dojo-secrets
              key: vapid-private-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
