apiVersion: apps/v1
kind: Deployment
metadata:
  name: dojo-frontend
  namespace: dojo
  labels:
    app: dojo-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dojo-frontend
  template:
    metadata:
      labels:
        app: dojo-frontend
    spec:
      containers:
      - name: frontend
        image: <region>.ocir.io/<tenancy>/dojo-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
