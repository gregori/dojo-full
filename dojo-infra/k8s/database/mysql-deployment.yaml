apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: dojo
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dojo-secrets
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: "dojo_db"
        - name: MYSQL_USER
          value: "dojo_user"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dojo-secrets
              key: mysql-password
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc
