apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dojo-ingress
  namespace: dojo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: dojo.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: dojo-backend
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dojo-frontend
            port:
              number: 80
