# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to render migration file names
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .hierarchical revision numbering
# version_path_separator = os.sep  # Use os.sep to split on the appropriate separator

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# Database URL - read from environment variable
# The actual URL is set in env.py from the DATABASE_URL env var
sqlalchemy.url = mysql+aiomysql://root:@localhost:3306/dojo

[post_write_hooks]
# post_write_hooks defines scripts that run after migration files are generated
# hooks can be formatted with Python string interpolation
# e.g., ruff will run ruff on the generated file
# post_write_hooks = ruff

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S